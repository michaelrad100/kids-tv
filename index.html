<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Who's watching?</title>
<meta name="description" content="Hand-picked videos for the kids, one channel each.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f4f6fb">
<link rel="icon" type="image/svg+xml" href="mala/icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
  /* The front door: one big TV per kid. Each channel lives in its own folder (mala/, maya/) and runs the shared tv.js. */
  :root { --paper: #f4f6fb; --ink: #1d2550; --muted: #6b7394; --card: #fff; --rule: #dde2f0; --amber: #ffc845;
    --sign: "Bungee", "Arial Black", Impact, sans-serif; --body: "Nunito", ui-rounded, system-ui, sans-serif; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; }
  body { background: var(--paper); color: var(--ink); font: 17px/1.4 var(--body); font-weight: 600; -webkit-font-smoothing: antialiased;
    background-image: radial-gradient(circle, rgba(29,37,80,.07) 1.2px, transparent 1.4px); background-size: 22px 22px;
    min-height: 100dvh; display: grid; place-items: center; padding: calc(env(safe-area-inset-top) + 24px) 16px calc(env(safe-area-inset-bottom) + 24px); }
  main { width: 100%; max-width: 720px; display: grid; gap: 28px; text-align: center; }
  h1 { margin: 0; font-family: var(--sign); font-weight: 400; font-size: clamp(30px, 8vw, 48px); line-height: 1.05; }
  .kids { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(240px, 100%), 1fr)); gap: 20px; }
  .kids a { display: grid; justify-items: center; gap: 14px; padding: 26px 18px 22px; border-radius: 26px; background: var(--card); border: 3px solid var(--rule);
    color: var(--ink); text-decoration: none; box-shadow: 0 8px 0 var(--rule), 0 16px 30px -18px rgba(29,37,80,.5); }
  .kids a:active { transform: translateY(5px); box-shadow: 0 3px 0 var(--rule); }
  .kids a:focus-visible { outline: 4px solid var(--amber); outline-offset: 4px; }
  .kids img { width: min(160px, 50vw); height: auto; }
  .kids b { font-family: var(--sign); font-weight: 400; font-size: clamp(26px, 6vw, 34px); line-height: 1; }
  .kids b span { color: var(--c); }
</style>
</head>
<body>
  <main>
    <h1>Who's watching?</h1>
    <nav class="kids">
      <a href="mala/" style="--c:#8b5cf6"><img src="mala/icon.svg" alt=""><b>Mala <span>TV</span></b></a>
      <a href="maya/" style="--c:#ec4899"><img src="maya/icon.svg" alt=""><b>Maya <span>TV</span></b></a>
    </nav>
  </main>
</body>
</html>
